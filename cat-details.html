<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuki - Lost Cat</title>
  <meta name="description" content="Yuki is lost. Please contact the owner." />
  <meta name="theme-color" content="#FFF7EE" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page profile-page">
    <header class="profile-header">
      <p class="eyebrow">🐾 Cat profile</p>
      <h1>🐾 I'M LOST 😿</h1>
      <p>Please contact my parents! ❤️</p>
    </header>

    <section class="profile-card" aria-label="Lost cat profile details">
      <div class="profile-photo-wrap">
        <img
          class="profile-photo"
          src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?auto=format&fit=crop&w=900&q=80"
          alt="Yuki the cat"
        />
      </div>

      <h2 class="cat-name">Hi! I'm Yuki 🐾</h2>

      <div class="info-list">
        <div class="info-row">
          <span class="label">Owner / Parent</span>
          <span class="value">Vidya Nanaware</span>
        </div>
        <div class="info-row">
          <span class="label">Phone</span>
          <span class="value">7208542366 / 9967055482</span>
        </div>
        <div class="info-row">
          <span class="label">Location</span>
          <span class="value">Mumbai, Maharashtra</span>
        </div>
      </div>

      <div class="profile-actions">
        <a class="btn btn-primary" href="tel:+917208542366">📞 CALL MY PARENT</a>
        <a
          class="btn btn-wa"
          href="https://wa.me/917208542366?text=Hi%21%20I%20found%20your%20cat.%20Please%20contact%20me%20so%20we%20can%20get%20them%20home%20safely.%20%F0%9F%90%BE"
          target="_blank"
          rel="noopener noreferrer"
        >💬 WHATSAPP MY PARENT</a>
      </div>
    </section>
  </main>
</body>
</html>
