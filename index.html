<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Cat QR Tag</title>
  <meta name="description" content="Print the QR collar tag for Mochi.">
  <meta name="theme-color" content="#FFF7EE">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="paw" viewBox="0 0 52 56"><ellipse cx="9" cy="16" rx="6" ry="8.5" transform="rotate(-16 9 16)"/><ellipse cx="20.5" cy="8" rx="6" ry="8.5" transform="rotate(-5 20.5 8)"/><ellipse cx="33.5" cy="8" rx="6" ry="8.5" transform="rotate(5 33.5 8)"/><ellipse cx="45" cy="16" rx="6" ry="8.5" transform="rotate(16 45 16)"/><path d="M27 25C34.5 25 43 31 43 40c0 8.5-6.5 13.5-13.5 13.5-1.5 0-2.1-1-2.5-2.1-.4 1.1-1 2.1-2.5 2.1C17.5 53.5 11 48.5 11 40c0-9 8.5-15 16-15Z"/></symbol>
    <symbol id="ic-heart" viewBox="0 0 24 24"><path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></symbol>
    <symbol id="ic-print" viewBox="0 0 24 24"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3Zm-3 11H8v-5h8v5Zm3-7a1 1 0 1 1 0-2 1 1 0 0 1 0 2ZM18 3H6v4h12V3Z"/></symbol>
    <symbol id="ic-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7ZM5 18v2h14v-2H5Z"/></symbol>
  </svg>

  <main class="page qr-page">
    <header class="qr-header">
      <p class="eyebrow"><svg class="icon"><use href="#paw"/></svg> Mochi's collar tag</p>
      <h1>🐾 I'M LOST 😿</h1>
      <p>Please contact my parents! <span aria-hidden="true">❤️</span></p>
    </header>

    <section class="tag-card fixed-tag" aria-label="Printable QR collar tag">
      <div class="tag-qr" id="tagQr" aria-label="QR code linking to Mochi's details page"></div>
      <p class="tag-scanme">SCAN ME</p>
    </section>

    <div class="qr-actions">
      <button class="btn btn-call" id="downloadQr" type="button"><svg class="icon"><use href="#ic-download"/></svg>DOWNLOAD QR</button>
      <button class="btn-ghost" id="printQr" type="button"><svg class="icon"><use href="#ic-print"/></svg>PRINT QR</button>
    </div>
    <p class="qr-note">Print the tag at least 2–3 cm wide and keep the white border clear.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
