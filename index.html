<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost Cat QR Tag</title>
  <meta name="description" content="QR collar tag for Mochi" />
  <meta name="theme-color" content="#FFF7EE" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page qr-page">
    <header class="qr-header">
      <p class="eyebrow">🐾 Lost cat</p>
      <h1>🐾 I'M LOST 😿</h1>
      <p>Please contact my parents! ❤️</p>
    </header>

    <section class="tag-card" aria-label="Lost cat QR collar tag">
      <div id="tagQr" class="tag-qr" aria-label="QR code for lost cat details"></div>
      <p class="tag-scanme">SCAN ME</p>
    </section>

    <div class="qr-actions">
      <button class="btn btn-primary" id="downloadQr" type="button">⬇️ DOWNLOAD QR</button>
      <button class="btn btn-secondary" id="printQr" type="button">🖨️ PRINT QR</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="script.js"></script>
</body>
</html>
